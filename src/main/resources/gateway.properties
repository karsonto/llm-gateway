gateway.port=8088
vllm.host=123.33.61.136
vllm.port=8088
gateway.maxContentLength=10485760
# Comma-separated exact path match (query string ignored)
gateway.path.whitelist=/v1/chat/completions,/v1/completions,/v1/usage,/v1/admin/usage
# SQLite required for admin console key/usage management
gateway.sqlite.path=./data/gateway.db
# Optional external override (Docker): env GATEWAY_CONFIG or -Dgateway.config=/path/to/gateway.properties
# Admin console login (http://host:port/admin/)
gateway.admin.username=admin
gateway.admin.password=admin123
# Flattened role=user prompts CSV (text,label); empty disables. Rotates at 50MB.
classification.collect.csv=./data/user_prompts.csv
# When sqlite path is set, gateway.api.keys is ignored.
# Format: key or key:name, comma-separated (memory mode only)
# gateway.api.keys=sk-alice:alice,sk-bob:bob
